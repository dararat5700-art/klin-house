<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KLIN House</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet"><style>body{margin:0;background:#f3eee6;color:#1c1a17;font-family:Jost,sans-serif}a{color:inherit;text-decoration:none}.nav,.hero,section,footer{padding:28px 7vw}.nav{display:flex;justify-content:space-between}.mark,h1,h2,h3{font-family:"Cormorant Garamond",serif}h1{font-size:72px;line-height:.9}h1 em{font-style:italic}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #e4dccf;background:#faf7f2;padding:22px}.btn{display:inline-block;border:1px solid #1c1a17;padding:12px 16px;margin-right:8px}.solid{background:#1c1a17;color:#faf7f2}input,textarea,select{width:100%;border:0;border-bottom:1px solid #e4dccf;background:transparent;padding:10px 0;font:inherit}button{background:#1c1a17;color:#faf7f2;border:0;padding:12px 16px}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:48px}}</style></head><body><header class="nav"><div class="mark">KLIN</div><div>House</div></header><section class="hero"><p>ATELIER + MAISON</p><h1>Keep it<br>memorable.<br><em>Keep it KLIN.</em></h1><p>บ้านของดอกไม้ อเทลิเยร์สำหรับช่อและการ์ด เมซงสำหรับซุ้มและล็อบบี้</p><a class="btn solid" href="#inquire">ขอใบเสนอราคา</a></section><section id="houses" class="grid"><article class="card"><h3>Atelier</h3><p>ช่อ แท็ก การ์ด โทนขาวกับเขียวเสจ</p></article><article class="card"><h3>Maison</h3><p>ซุ้มโรงแรม เสา ประตู ล็อบบี้ โทนไอวอรี บลัช มอฟ</p></article></section><section id="inquire"><h2>บอกงานที่อยากให้จัด</h2><form onsubmit="event.preventDefault()"><input placeholder="ชื่อ"><textarea placeholder="รายละเอียดงาน"></textarea><button>ส่งข้อความ</button></form></section><footer><div>KLIN House</div><div>Lasting impression</div></footer></body></html>
